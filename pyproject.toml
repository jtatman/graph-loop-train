[project]
name = "graph-loop-train"
version = "0.1.0"
description = "train laya model in graph loop agentic method"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "torch>=2.14.0",
    "laya",
    "pandas",
    "scikit-learn",
    "safetensors",
    "huggingface-hub",
    "pyarrow",
    "requests",
    "datasets",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

